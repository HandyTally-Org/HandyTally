name: Build web app

# HT-41: the one build every deploy uses. Pull requests, master (demo) and
# release tags (prod) all call this workflow, so the bytes a customer ends up
# running were built exactly the way CI checked them. The caller passes
# `app_version`; empty means "label this build master-<sha7>".

on:
  workflow_call:
    inputs:
      app_version:
        description: Version label baked into the bundle (a tag such as v1.5.0; empty for master-<sha7>)
        required: false
        type: string
        default: ''
    outputs:
      app_version:
        description: The version label the bundle was built with
        value: ${{ jobs.build.outputs.app_version }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    env:
      # Repository variables when set. The fallbacks are the production values,
      # which are public by construction (they ship in the bundle) and match the
      # defaults in web/lib/supabase.ts (HT-38).
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://supabase.axiappm.com' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSIsImlhdCI6MTc2NTc3MDAwMCwiZXhwIjo0OTIxNDQzNjAwLCJyb2xlIjoiYW5vbiJ9.gO1H0XzlOU2T9ayabs3A5k6RsNLqqCUv93IG8k3wflk' }}
      EXPO_PUBLIC_BASE_DOMAIN: ${{ vars.EXPO_PUBLIC_BASE_DOMAIN || 'handytally.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Version label
        id: version
        # Expo inlines EXPO_PUBLIC_* at export time, so the bundle carries its
        # own version (drawer footer, /whats-new) and release-json.mjs writes
        # the same value to dist/release.json for scripts.
        env:
          APP_VERSION_INPUT: ${{ inputs.app_version }}
        run: |
          version="$APP_VERSION_INPUT"
          if [ -z "$version" ]; then
            version="master-${GITHUB_SHA::7}"
          fi
          echo "app_version=$version" >> "$GITHUB_OUTPUT"
          echo "EXPO_PUBLIC_APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_BUILD_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "Building $version ($GITHUB_SHA)"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        # Pure-function tests only (tenant hostname parsing, HT-38; label merging,
        # HT-49; nav order rules, HT-50; custom field rules, HT-52); no native or
        # rendering setup is involved.
        run: npx jest --ci --watchAll=false lib/tenant.test.ts constants/labels.test.ts constants/organizationSettings.test.ts constants/customFields.test.ts

      - name: Export static web bundle
        # The same bundle the deploy jobs ship, so a PR that breaks the export
        # fails here before it can reach master.
        run: npx expo export --platform web

      - name: Write dist/release.json
        run: node scripts/release-json.mjs

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
