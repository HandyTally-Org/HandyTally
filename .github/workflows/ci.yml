name: CI

# Pull requests: build and test only.
# Push to master: build, then deploy to demo.handytally.com (HT-41).
#
# Nothing here reaches prod or a customer host. Prod is updated by
# release.yml when a vX.Y.Z tag is pushed; customers by promote.yml, by hand.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Build web app
    uses: ./.github/workflows/build-web.yml

  web-deploy-demo:
    name: Deploy to demo
    # Only the bundle built from master is deployed; PRs stop at the build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: web-build
    runs-on: ubuntu-latest
    steps:
      # Needed for web/wrangler.jsonc; the bundle itself comes from the build job.
      - uses: actions/checkout@v4

      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Deploy with Wrangler (env demo)
        # Assets-only Worker `handytally-web-demo`, the `env.demo` block of
        # web/wrangler.jsonc. The action installs wrangler itself.
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy --env demo

      - name: Verify demo serves this build
        run: bash .github/scripts/verify-release.sh "https://demo.${{ vars.EXPO_PUBLIC_BASE_DOMAIN || 'handytally.com' }}" "${{ needs.web-build.outputs.app_version }}"
